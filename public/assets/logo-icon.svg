<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A4A7C"/>
      <stop offset="100%" stop-color="#153D68"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Decorative green glow circle (upper right) -->
  <circle cx="380" cy="130" r="110" fill="#4CAF50" opacity="0.15"/>

  <!-- White check/arrow mark (the "mentor's forward step") -->
  <g fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upward step line -->
    <path d="M152 360 L152 200 L280 200"/>
    <!-- Right forward check -->
    <path d="M280 200 L280 330 L392 218"/>
  </g>

  <!-- Green accent dot (the "growth point") -->
  <circle cx="392" cy="218" r="18" fill="#4CAF50"/>
</svg>
