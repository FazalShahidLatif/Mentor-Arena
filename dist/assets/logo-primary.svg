<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A4A7C"/>
      <stop offset="100%" stop-color="#153D68"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square badge -->
  <rect x="0" y="0" width="360" height="360" rx="64" fill="url(#bgGrad)"/>

  <!-- Decorative green glow (upper right of badge) -->
  <circle cx="274" cy="96" r="82" fill="#4CAF50" opacity="0.14"/>

  <!-- White check/arrow mark -->
  <g fill="none" stroke="white" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 260 L110 150 L208 150"/>
    <path d="M208 150 L208 242 L296 168"/>
  </g>

  <!-- Green accent dot -->
  <circle cx="296" cy="168" r="14" fill="#4CAF50"/>

  <!-- Wordmark: "Mentor" -->
  <text x="400" y="168"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="100" font-weight="800" fill="#1A4A7C"
        letter-spacing="-2">
    Mentor
  </text>

  <!-- Wordmark: "Arena" -->
  <text x="400" y="276"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="100" font-weight="800" fill="#1A4A7C"
        letter-spacing="-2">
    Arena
  </text>

  <!-- Tagline -->
  <text x="402" y="328"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="28" font-weight="500" fill="#153D68"
        letter-spacing="0.5">
    1-to-1 Digital Skills Mentorship
  </text>

  <!-- Pakistan tag -->
  <text x="402" y="366"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="18" font-weight="400" fill="#4CAF50"
        letter-spacing="2">
    PAKISTAN
  </text>
</svg>
